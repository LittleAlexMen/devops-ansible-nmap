---
- name: Copy targets file and run nmap with -iL
  hosts: webservers
  become: yes
  become_method: sudo
  remote_user: alex

  tasks:
    - name: Install nmap
      ansible.builtin.apt:
        name: nmap
        state: present
        update_cache: yes

    - name: Copy targets list to remote host
      ansible.builtin.copy:
        src: ./targets.txt
        dest: /home/alex/targets.txt
        mode: '0644'

    - name: Run nmap using the copied file
      ansible.builtin.shell: "nmap -iL /home/alex/targets.txt -p 80 -oG -"
      register: nmap_result

    - name: Display scan output
      ansible.builtin.debug:
        msg: "{{ nmap_result.stdout_lines }}"
